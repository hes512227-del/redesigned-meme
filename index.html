
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Parts Hub | قطع غيار السيارات</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172337}
header{background:#101d30;color:white;padding:22px 7%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{font-size:25px;font-weight:bold}.logo span{color:#f59e0b}
nav a{color:white;text-decoration:none;margin:0 10px}
.hero{background:linear-gradient(110deg,#101d30,#263e5b);color:white;padding:75px 8%;text-align:center}
.hero h1{font-size:38px;margin:0 0 15px}
.hero p{color:#d6dfeb;font-size:18px}
.btn{background:#f59e0b;color:#172337;padding:13px 24px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
.search{max-width:600px;margin:25px auto;display:flex;gap:8px;padding:0 15px}
.search input{flex:1;padding:14px;border:1px solid #ddd;border-radius:7px}
main{padding:35px 7%}
h2{margin-bottom:20px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.categories button{border:1px solid #ddd;background:white;padding:10px 18px;border-radius:20px;cursor:pointer}
.categories button.active{background:#101d30;color:white}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 15px #15243a12}
.product-img{height:160px;background:#e8edf3;display:grid;place-items:center;font-size:60px}
.card-content{padding:17px}
.card h3{margin:5px 0 12px}
.price{color:#d97706;font-weight:bold;margin-bottom:15px}
footer{background:#101d30;color:white;text-align:center;padding:30px;margin-top:45px}
#cart{position:fixed;bottom:20px;left:20px;background:#f59e0b;color:#172337;padding:15px 22px;border:0;border-radius:30px;font-weight:bold;cursor:pointer}
#cartItems{background:white;padding:20px;border-radius:10px;margin-top:15px}
</style>
</head>
<body>

<header>
  <div class="logo">AUTO PARTS <span>HUB</span></div>
  <nav>
    <a href="#">الرئيسية</a>
    <a href="#products">المنتجات</a>
    <a href="#contact">تواصل معنا</a>
  </nav>
</header>

<section class="hero">
  <h1>كل قطع غيار سيارتك في مكان واحد</h1>
  <p>جودة عالية، اختيارات متنوعة، وخدمة تهتم بسيارتك</p>
  <a href="#products"><button class="btn">تسوق الآن</button></a>
</section>

<div class="search">
  <input id="search" placeholder="ابحث عن قطعة الغيار...">
</div>

<main id="products">
<h2>تسوق حسب القسم</h2>
<div class="categories">
  <button class="active" onclick="filter('الكل',this)">الكل</button>
  <button onclick="filter('فلاتر',this)">فلاتر</button>
  <button onclick="filter('فرامل',this)">فرامل</button>
  <button onclick="filter('محركات',this)">محركات</button>
  <button onclick="filter('إضاءة',this)">إضاءة</button>
</div>

<h2>منتجاتنا</h2>
<div class="products" id="productsList"></div>
<div id="cartItems"></div>
</main>

<footer id="contact">
  <h2>Auto Parts Hub</h2>
  <p>وجهتك لقطع غيار السيارات</p>
  <p>تواصل معنا قريباً عبر واتساب</p>
  <p>© 2026 Auto Parts Hub</p>
</footer>

<button id="cart" onclick="showCart()">🛒 السلة (<span id="count">0</span>)</button>

<script>
const products=[
 {name:"فلتر زيت",category:"فلاتر",price:"السعر يحدد لاحقاً",icon:"🛢️"},
 {name:"فلتر هواء",category:"فلاتر",price:"السعر يحدد لاحقاً",icon:"⚙️"},
 {name:"تيل فرامل",category:"فرامل",price:"السعر يحدد لاحقاً",icon:"🔧"},
 {name:"طنابير فرامل",category:"فرامل",price:"السعر يحدد لاحقاً",icon:"⚙️"},
 {name:"قطع محرك",category:"محركات",price:"السعر يحدد لاحقاً",icon:"🚗"},
 {name:"مصابيح سيارات",category:"إضاءة",price:"السعر يحدد لاحقاً",icon:"💡"}
];
let cart=[];
let current="الكل";

function render(){
 const term=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>
 (current==="الكل"||p.category===current)&&p.name.toLowerCase().includes(term)
 );
 document.getElementById("productsList").innerHTML=list.map(p=>`
 <div class="card">
 <div class="product-img">${p.icon}</div>
 <div class="card-content">
 <h3>${p.name}</h3>
 <div class="price">${p.price}</div>
 <button class="btn" onclick="add('${p.name}')">أضف للسلة</button>
 </div></div>`).join("");
}
function filter(category,button){
 current=category;
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}
function add(name){
 cart.push(name);
 document.getElementById("count").textContent=cart.length;
}
function showCart(){
 const area=document.getElementById("cartItems");
 area.innerHTML="<h2>سلة المشتريات</h2>"+
 (cart.length?cart.map((p,i)=>`<p>${p} <button onclick="removeItem(${i})">حذف</button></p>`).join(""):"السلة فارغة")+
 (cart.length?'<button class="btn" onclick="alert(\'سيتم تفعيل إتمام الطلب بعد إضافة بيانات التواصل\')">إتمام الطلب</button>':"");
 area.scrollIntoView({behavior:"smooth"});
}
function removeItem(i){
 cart.splice(i,1);
 document.getElementById("count").textContent=cart.length;
 showCart();
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
